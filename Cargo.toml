[package]
edition = "2021"
name = "stm32g431-foc"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Thumb has no libtest/std. rust-analyzer --all-targets must not build tests.
[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "main"
path = "src/bin/main/main.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
embassy-stm32 = { version = "0.6.0", features = ["defmt", "time-driver-tim2", "stm32g431cb", "unstable-pac", "exti"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.0.0"
micromath = "2.1.0"

[profile.release]
debug = 2
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 2
opt-level = "s"
lto = "thin"