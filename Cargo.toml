[package]
edition = "2021"
name = "stm32g431-foc"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
embassy-stm32 = { version = "0.6.0", features = ["defmt", "time-driver-any", "stm32g431cb", "unstable-pac", "exti"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt", "arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-futures = "0.2.0"
defmt = "0.3.8"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "2.1.0"
embedded-io = "0.6.1"
embedded-io-async = "0.6.4"
embedded-cli = { git = "https://github.com/funbiscuit/embedded-cli-rs", default-features = false, features = ["macros", "history", "autocomplete", "help"] }
ufmt = "0.2.0"

[profile.release]
debug = 2
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 2
opt-level = "s"
lto = "thin"