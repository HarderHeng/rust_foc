[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32G431CB"
rustflags = [
    "-C", "linker=flip-link",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv7em-none-eabihf"

[alias]
# Unit tests need a host target (thumb has no libtest).
htest = "test -p foc --target x86_64-unknown-linux-gnu"

# Compile-time defmt filter. Unset means all `defmt::*` macros are stripped.
[env]
DEFMT_LOG = "info"