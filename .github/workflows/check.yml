name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Install firmware linker
        run: cargo install flip-link --version 0.1.12 --locked --target x86_64-unknown-linux-gnu
      - name: Check formatting, host tests, firmware and lint; link release firmware
        run: python3 scripts/check.py --build --timeout 300
      - name: Upload release firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32g431-foc
          path: target/thumbv7em-none-eabihf/release/main
          if-no-files-found: error
